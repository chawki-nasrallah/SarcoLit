[project]
name = "sarcolit"
version = "0.0.0"
description = "Retrieval-augmented LLM assistant for the sarcopenia and elderly muscle-health literature."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chawki Nasrallah" }]
keywords = ["rag", "llm", "biomedical", "sarcopenia", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarcolit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
markers = [
    "eval: end-to-end eval tests (slow, may need GPU/API access)",
]
addopts = "-ra"