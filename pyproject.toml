[project]
name = "sarcolit"
version = "0.0.0"
description = "Retrieval-augmented LLM assistant for the sarcopenia and elderly muscle-health literature."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chawki Nasrallah" }]
keywords = ["rag", "llm", "biomedical", "sarcopenia", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "datasets>=2.20",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Heavy GPU/ML stack for v0.2+ (retrieval + generation). Kept separate from core
# so the ingest pipeline and CI stay lightweight (no PyTorch in the default install).
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "bitsandbytes>=0.43",          # 4-bit (NF4) quantization; has Windows wheels
    "qdrant-client>=1.11",         # local vector store
    "rank-bm25>=0.2",              # sparse/lexical retrieval for hybrid search (v0.4)
]
# Eval tooling (v0.3): Claude as LLM-judge + synthetic-question generation.
# Only the *evaluator* uses an API model; the RAG generator stays local Qwen.
eval = [
    "anthropic>=0.40",
]

# Pull PyTorch from the CUDA 12.1 wheel index (GPU build) rather than the
# default CPU-only wheels. Matches the RTX 3060 (Ampere) + recent driver.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarcolit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
markers = [
    "eval: end-to-end eval tests (slow, may need GPU/API access)",
]
addopts = "-ra"